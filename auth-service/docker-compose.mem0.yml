# Optional production overlay for the owner-scoped Mem0 outbox.
# Compose this file together with the deployment stack and keep MEMORY_ENABLED
# disabled until a local or explicitly approved model provider is available.
services:
  auth-service:
    image: ${AUTH_SERVICE_IMAGE}
    environment:
      MEMORY_ENABLED: ${MEMORY_ENABLED:-0}
      MEMORY_OUTBOX_ENABLED: ${MEMORY_OUTBOX_ENABLED:-1}
      MEMORY_DATABASE_URL: postgresql://mem0:${MEMORY_POSTGRES_PASSWORD}@mem0-postgres:5432/mem0
      MEMORY_PROVIDER_API_KEY: ${MEMORY_PROVIDER_API_KEY}
      MEMORY_COLLECTION: ${MEMORY_COLLECTION:-ansatz_memory_v2}
      MEMORY_EMBEDDING_DIMS: ${MEMORY_EMBEDDING_DIMS:-1024}
      MEMORY_OPENAI_BASE_URL: ${MEMORY_OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MEMORY_LLM_PROVIDER: ${MEMORY_LLM_PROVIDER:-openai}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-ZHIPU/GLM-5.3-Flash}
      MEMORY_LLM_MAX_TOKENS: ${MEMORY_LLM_MAX_TOKENS:-1000}
      MEMORY_EMBEDDER_PROVIDER: ${MEMORY_EMBEDDER_PROVIDER:-openai}
      MEMORY_EMBEDDER_MODEL: ${MEMORY_EMBEDDER_MODEL:-qwen3.7-text-embedding-flash}
      MEMORY_JUDGE_PROVIDER: ${MEMORY_JUDGE_PROVIDER:-openai}
      MEMORY_JUDGE_MODEL: ${MEMORY_JUDGE_MODEL:-qwen3.8-flash}
      MEMORY_RERANK_ENABLED: ${MEMORY_RERANK_ENABLED:-1}
      MEMORY_RERANK_TOP_K: ${MEMORY_RERANK_TOP_K:-5}
      MEMORY_OLLAMA_BASE_URL: ${MEMORY_OLLAMA_BASE_URL:-http://ollama:11434}
      MEMORY_MEM0_DIR: /data/mem0
      MEMORY_TELEMETRY: ${MEMORY_TELEMETRY:-0}
      MEM0_TELEMETRY: ${MEM0_TELEMETRY:-false}
    depends_on:
      mem0-postgres:
        condition: service_healthy

  mem0-postgres:
    image: ${MEM0_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEMORY_POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - "${DEPLOY_ROOT}/data/mem0-postgres:/var/lib/postgresql/data"
    networks:
      service:
        ipv4_address: 10.89.2.40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  memory-worker:
    image: ${AUTH_SERVICE_IMAGE}
    # The worker is started manually after MEMORY_ENABLED is switched on. It
    # exits cleanly when the feature flag is off instead of restart-looping.
    restart: unless-stopped
    env_file:
      - "${DEPLOY_ROOT}/secrets/server.env"
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_DB_PATH: /data/db.sqlite3
      LANGFUSE_INTERNAL_BASE_URL: http://langfuse-web:3000/langfuse/api/public
      LANGFUSE_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-0}
      MEMORY_OUTBOX_ENABLED: ${MEMORY_OUTBOX_ENABLED:-1}
      MEMORY_DATABASE_URL: postgresql://mem0:${MEMORY_POSTGRES_PASSWORD}@mem0-postgres:5432/mem0
      MEMORY_COLLECTION: ${MEMORY_COLLECTION:-ansatz_memory_v2}
      MEMORY_EMBEDDING_DIMS: ${MEMORY_EMBEDDING_DIMS:-1024}
      MEMORY_OPENAI_BASE_URL: ${MEMORY_OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MEMORY_LLM_PROVIDER: ${MEMORY_LLM_PROVIDER:-openai}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-ZHIPU/GLM-5.3-Flash}
      MEMORY_LLM_MAX_TOKENS: ${MEMORY_LLM_MAX_TOKENS:-1000}
      MEMORY_EMBEDDER_PROVIDER: ${MEMORY_EMBEDDER_PROVIDER:-openai}
      MEMORY_EMBEDDER_MODEL: ${MEMORY_EMBEDDER_MODEL:-qwen3.7-text-embedding-flash}
      MEMORY_JUDGE_PROVIDER: ${MEMORY_JUDGE_PROVIDER:-openai}
      MEMORY_JUDGE_MODEL: ${MEMORY_JUDGE_MODEL:-qwen3.8-flash}
      MEMORY_RERANK_ENABLED: ${MEMORY_RERANK_ENABLED:-1}
      MEMORY_RERANK_TOP_K: ${MEMORY_RERANK_TOP_K:-5}
      MEMORY_OLLAMA_BASE_URL: ${MEMORY_OLLAMA_BASE_URL:-http://ollama:11434}
      MEMORY_MEM0_DIR: /data/mem0
      MEMORY_TELEMETRY: ${MEMORY_TELEMETRY:-0}
      MEM0_TELEMETRY: ${MEM0_TELEMETRY:-false}
    command: ["python", "manage.py", "memory_worker", "--batch-size", "4", "--sleep-seconds", "5"]
    volumes:
      - "${DEPLOY_ROOT}/data/auth:/data"
    depends_on:
      mem0-postgres:
        condition: service_healthy
    networks:
      - service
