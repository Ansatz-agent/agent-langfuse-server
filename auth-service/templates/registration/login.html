{% extends "base.html" %}
{% block title %}登录 · Agent History{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>登录 Agent History</h1>
  {% if form.errors %}<p class="error">用户名或密码不正确，或账号已被禁用。</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">用户名</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">密码</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">登录</button>
  </form>
</section>
{% endblock %}
