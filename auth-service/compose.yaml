services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    container_name: agent-history-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_STATIC_ROOT: /data/staticfiles
    volumes:
      - /var/lib/agent-history:/data:Z
    networks:
      npm:
        aliases:
          - agent-history-web
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
