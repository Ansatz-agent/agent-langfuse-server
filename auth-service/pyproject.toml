[project]
name = "agent-history-portal"
version = "0.1.0"
description = "Multi-user, owner-scoped Hermes history portal"
requires-python = ">=3.10"
dependencies = [
  "Django==5.2.17",
  "django-axes==8.3.1",
  "gunicorn==23.0.0",
  "markdown-it-py==4.2.0",
  "whitenoise==6.12.0",
  "mem0ai==2.0.19",
  "ollama>=0.3.0,<1.0.0",
  "psycopg[binary,pool]>=3.2.8,<4.0.0",
]

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "ruff==0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["history/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"history/tests/**/*.py" = ["S106"]

[tool.uv]
default-groups = ["dev"]
