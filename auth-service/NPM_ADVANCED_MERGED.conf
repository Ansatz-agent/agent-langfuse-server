include /etc/nginx/mime.types;

 default_type  application/octet-stream;

 root /var/www/chevereto;

    # 2026-06-13 xzq  -- deploy test (static+dynamic); replicate for /xuzhiqin and /cv
    location ^~ /xzqtest {
        root /var/www;
        index index.html index.php;
        try_files $uri $uri/ /xzqtest/index.php?$query_string;
        location ~ \.php($|/) {
            fastcgi_pass unix:/run/php-fpm/www.sock;
            include         fastcgi_params;
            fastcgi_param   SCRIPT_FILENAME    $document_root$fastcgi_script_name;
            fastcgi_param   SCRIPT_NAME        $fastcgi_script_name;
        }
    }

    # 2026-06-13 xzq  personal homepage (static)
    location ^~ /xuzhiqin {
        root /var/www;
        index index.html;
    }

    # 2026-06-13 xzq  cv (PHP8 app) -> fastcgi to cv-php8 container
    location ^~ /cv {
        root /var/www;
        index index.php index.html;
        try_files $uri $uri/ /cv/index.php?$query_string;
        location ~ \.php($|/) {
            fastcgi_pass cv-php8:9000;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include         fastcgi_params;
            fastcgi_param   SCRIPT_FILENAME    $document_root$fastcgi_script_name;
            fastcgi_param   SCRIPT_NAME        $fastcgi_script_name;
            fastcgi_read_timeout 120;
        }
    }


 location / {
        alias /var/www/lr_static_web/;
        index index.html;
        add_header Cache-Control "no-store"; # 2025-7-17
    }
    # 2024-03-26 xzq
    location /paper {
        alias /var/www/lr_static_web/paper/;
        index index.php;
    }

    location /subscribe-admin {
	alias /var/www/lr_static_web/subscribe_admin/;
	index admin.html;
    }

    location /static-backend {
	proxy_pass http://localhost:8080;

        if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }
    }

    location /bbs {
        alias /var/www/lr_bbs_front/;
	index index.html;
    }

    location /bbs-admin {
	alias /var/www/lr_bbs_front/admin/;
	index index.html;
    }

    location /bbs-backend {
        proxy_pass http://localhost:8080;

	if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }

       if ($request_method ~* '(GET|POST|DELETE|PUT)') {
                add_header 'Access-Control-Allow-Origin' '*' always;
            }
    }

    location /minio {
        proxy_pass http://localhost:9000;
    }

    location /bbs-img/ {
        proxy_pass http://localhost:9000;
    }

    location ^~/chevereto {
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;
        alias /var/www/chevereto;

        if ( $uri ~ /chevereto/api){
                rewrite ^/api/(.*)$ /$1 break;
        }

        location ~ .+\.php($|/) {
         # alias /var/www/chevereto;
         # With php-fpm unix sockets
         fastcgi_pass unix:/run/php-fpm/www.sock;
         include         fastcgi_params;
         fastcgi_param   SCRIPT_FILENAME    /var/www$fastcgi_script_name;
         fastcgi_param   SCRIPT_NAME        $fastcgi_script_name;
        }
    }

    location ^~/api/ {
          # rewrite ^/v1/(.*)$ /$1 break;
          proxy_pass http://localhost:81;
    }

    location ~ \.php$ {
         root /var/www/lr_static_web/;
         # With php-fpm unix sockets
         fastcgi_pass unix:/run/php-fpm/www.sock;
         include         fastcgi_params;
         fastcgi_param   SCRIPT_FILENAME    $document_root$fastcgi_script_name;
         fastcgi_param   SCRIPT_NAME        $fastcgi_script_name;
    }

    location ^~ /agent/healthz {
        return 404;
    }

    location ^~ /agent/ {

        client_max_body_size 26m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /agent;
        proxy_set_header Connection "";

        rewrite ^/agent/$ /dashboard/ break;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://agent-history-web:8000;
        proxy_redirect off;
    }
